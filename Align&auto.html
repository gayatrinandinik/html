<!DOCTYPE html>
<html>
    <head>
        <title>align and auto</title>
        <style>
            .container{
                align-items: center;
            }
            .item{
                align-self: flex-end;
            }
        </style>
    </head>
    <body>
        <h1>Align Items</h1>
        <div class="container">
            <p>Exaplantion:</p>
            <p>Aligns items verfically.</p>
        </div>
        <div class=" output">
            <p>Expected output:</p>
            <p>items verfically centered.</p>
        </div>
        <h1>Align self</h1>
        <div class="item">
            <p>Exaplantion:</p>
            <p>Aligns individual items.</p>
        </div>
        <div class="output">
            <p>Expected output:</p>
            <p>Single item moves downward.</p>
        </div>
    </body>
</html>
